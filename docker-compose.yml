version: '3.8'

services:
  web:
    build: .
    container_name: innovevents_web
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - db_sql
      - db_nosql

  mobile:
    image: nginx:alpine
    container_name: innovevents_mobile
    ports:
      - "8081:80"
    volumes:
      - ./mobile:/usr/share/nginx/html

  db_sql:
    image: mysql:8.0
    container_name: innovevents_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: innovevents_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

  db_nosql:
    image: mongo:6.0
    container_name: innovevents_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  adminer:
    image: adminer
    container_name: innovevents_adminer
    ports:
      - "8082:8080"

volumes:
  mysql_data:
  mongo_data:
